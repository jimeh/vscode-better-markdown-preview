version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    cooldown:
      default-days: 7
    open-pull-requests-limit: 6
    rebase-strategy: auto
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    groups:
      runtime-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        exclude-patterns:
          - '@semantic-release/*'
          - '@types/vscode'
          - '@vscode/vsce'
          - conventional-changelog-conventionalcommits
          - markdown-it
          - ovsx
          - semantic-release
        update-types:
          - minor
          - patch
      release-tooling-minor-and-patch:
        patterns:
          - '@semantic-release/*'
          - '@vscode/vsce'
          - conventional-changelog-conventionalcommits
          - ovsx
          - semantic-release
        update-types:
          - minor
          - patch
      host-compatibility-minor-and-patch:
        patterns:
          - '@types/vscode'
          - markdown-it
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/London
    open-pull-requests-limit: 2
    rebase-strategy: auto
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

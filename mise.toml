[settings]
minimum_release_age = "3d"

[tools]
actionlint = "1"
node = "24"
pinact = "4"
pnpm = "11"
taplo = "0"
zizmor = "1"

[tasks.setup]
description = "Install locked tools and dependencies"
run = ["mise install --locked", "pnpm install --frozen-lockfile"]

[tasks.dev]
description = "Watch extension hosts, preview assets, and TypeScript"
run = "pnpm run watch"

[tasks.build]
description = "Build production Extension Host and preview bundles"
run = "pnpm run build"

[tasks.format]
description = "Format source, configuration, and documentation"
run = ["pnpm run format", "taplo format mise.toml"]

[tasks."format:check"]
description = "Check source, configuration, and documentation formatting"
run = ["pnpm run format:check", "taplo format --check mise.toml"]

[tasks.lint]
description = "Run static analysis"
run = "pnpm run lint"

[tasks."lint:fix"]
description = "Apply safe static-analysis fixes"
run = "pnpm run lint:fix"

[tasks.typecheck]
description = "Check TypeScript types without emitting files"
run = "pnpm run typecheck"

[tasks.check]
description = "Run the fast local handoff gate"
run = [
  "mise run format:check",
  "mise run lint",
  "mise run typecheck",
  "mise run test:contracts",
  "mise run test:coverage",
]

[tasks.test]
description = "Run fast unit and Node contract tests without coverage"
run = "pnpm test"

[tasks."test:contracts"]
description = "Run typed Node contract tests"
run = "pnpm run test:contracts"

[tasks."test:coverage"]
description = "Run all-files V8 unit coverage with global and per-file floors"
run = "pnpm run test:coverage"

[tasks."test:hosts:prepare"]
description = "Build production artifacts and desktop and web host test runners"
run = "pnpm run test:hosts:prepare"

[tasks."test:host-runners:build"]
description = "Build narrow desktop and web host runners against existing artifacts"
run = "pnpm run build:host-runners"

[tasks."test:desktop:floor"]
description = "Run the prepared desktop contract on VS Code 1.125.0"
run = "pnpm run test:desktop:floor"

[tasks."test:desktop:stable"]
description = "Run the prepared desktop contract on stable VS Code"
run = "pnpm run test:desktop:stable"

[tasks."test:desktop"]
description = "Prepare and run desktop floor and stable compatibility"
run = [
  "mise run test:hosts:prepare",
  "mise run test:desktop:floor",
  "mise run test:desktop:stable",
]

[tasks."test:web:stable"]
description = "Run the prepared web contract in stable VS Code Chromium"
run = "pnpm run test:web:stable"

[tasks."test:extension"]
description = "Prepare and run desktop floor and stable host contracts"
run = "pnpm run test:extension"

[tasks.package]
description = "Build a VSIX in artifacts/"
run = "pnpm run package"

[tasks."package:validate"]
description = "Package and inspect the VSIX contents"
run = ["mise run package", "pnpm run test:package"]

[tasks."release:check"]
description = "Check semantic versioning, release output, and workflow contracts"
run = "node --test test/release.test.mts test/workflows.test.mts"

[tasks."release:package"]
description = "Build and verify the versioned VSIX and checksum for Semantic Release"
run = "pnpm run release:package"

[tasks.release]
description = "Run Semantic Release for the current CI revision"
run = "pnpm run release"

[tasks."ci:workflows"]
description = "Check workflow syntax, security, and action pins"
run = ["actionlint", "zizmor --offline .", "pinact run --check"]

[tasks.validate]
description = "Run broad repository validation once before host consumers"
run = ["mise run check", "mise run package:validate", "mise run ci:workflows"]

[tasks.verify]
description = "Run the intended-final-head local validation gate"
run = [
  "mise run validate",
  "mise run test:host-runners:build",
  "mise run test:desktop:floor",
  "mise run test:desktop:stable",
  "mise run test:web:stable",
]

[tasks.doctor]
description = "Report locked development tool versions"
run = [
  "node --version",
  "pnpm --version",
  "actionlint -version",
  "pinact --version",
  "taplo --version",
  "zizmor --version",
]

[tasks.clean]
description = "Remove generated build, test, and package output"
run = "node scripts/clean.mts"
